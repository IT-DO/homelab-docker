server {
    listen 80;
    server_name _;

    # health / заглушка, чтобы стек поднимался «из коробки»
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 200 "homelab-docker: nginx is up\n";
        add_header Content-Type text/plain;
    }

    # Пример проксирования на Grafana — раскомментируйте и поправьте:
    # location /grafana/ {
    #     proxy_pass http://grafana:3000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
